name: Cadrum OpenCascade exact BRep acceptance probe
on:
  push:
    branches:
      - evaluation/cadrum-occt-brep-acceptance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadrum-occt-brep-probe
  cancel-in-progress: true

jobs:
  isolated-occt-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install native linker requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config build-essential
      - name: Normalize isolated probe formatting (promotion still requires committed format)
        run: cargo fmt --manifest-path evaluations/cadrum/Cargo.toml --all
      - name: Compile and test exact BRep golden fixtures
        run: cargo test --manifest-path evaluations/cadrum/Cargo.toml -- --test-threads=1 --nocapture
      - name: Strict isolated adapter lint
        run: cargo clippy --manifest-path evaluations/cadrum/Cargo.toml --all-targets -- -D warnings
