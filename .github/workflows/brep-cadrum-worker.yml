name: WorldWright out-of-process exact BRep worker
on:
  push:
    branches:
      - feature/brep-occt-worker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldwright-brep-worker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  worker-acceptance:
    name: ${{ matrix.os }} BRep worker API and native executable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Linux native toolchain requirements
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config build-essential
      - name: Normalize prototype formatting
        run: cargo fmt --manifest-path evaluations/cadrum/Cargo.toml --all
      - name: Execute isolated exact BRep worker and golden fixtures
        run: cargo test --manifest-path evaluations/cadrum/Cargo.toml --all-targets -- --test-threads=1
      - name: Strict Rust adapter and protocol lint
        run: cargo clippy --manifest-path evaluations/cadrum/Cargo.toml --all-targets -- -D warnings
