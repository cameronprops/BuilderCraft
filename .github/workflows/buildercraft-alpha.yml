name: BuilderCraft alpha builds
on:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo xtask ci
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo test --workspace
      - run: cargo build --release -p cadcraft -p cadcraft-cli
      - uses: actions/upload-artifact@v4
        with:
          name: BuilderCraft-${{ runner.os }}-unsigned
          path: |
            target/release/cadcraft
            target/release/cadcraft.exe
            target/release/cadcraft-cli
            target/release/cadcraft-cli.exe
            LICENSE-MIT
            LICENSE-APACHE
            NOTICE
