name: Resolve Curvo evaluation lockfile
on:
  push:
    branches:
      - evaluation/curvo-nurbs-parity
    paths:
      - .github/workflows/curvo-eval-bootstrap.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evaluation/curvo-nurbs-parity
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Resolve Curvo and normal formatting
        run: |
          cargo update --workspace
          cargo fmt --all
      - name: Persist lockfile and formatted differential adapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/geom/src/curvo_evaluation.rs crates/geom/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "build: pin Curvo evaluation dependencies and format parity adapter"
            git push origin HEAD:evaluation/curvo-nurbs-parity
          fi
