name: Curvo NURBS differential acceptance
on:
  pull_request:
    branches:
      - main
    paths:
      - crates/geom/**
      - Cargo.lock
      - .github/workflows/curvo-nurbs-evaluation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Validate formatting
        run: cargo fmt --all -- --check
      - name: Compare canonical vs Curvo rational NURBS curves
        run: cargo test --locked -p cadcraft-geom --features curvo-eval curvo_evaluation -- --nocapture
      - name: Lint optional Curvo adapter
        run: cargo clippy --locked -p cadcraft-geom --features curvo-eval --all-targets -- -D warnings
