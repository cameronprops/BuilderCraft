name: WorldWriter source backup for Drive
on:
  push:
    branches:
      - feature/worldwriter-associative-brep-rebuild-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GDRIVE_SA_JSON: ${{ secrets.BUILDERCRAFT_DRIVE_SA_JSON }}
      GDRIVE_FOLDER_ID: ${{ vars.BUILDERCRAFT_DRIVE_FOLDER_ID }}
    steps:
      - name: Checkout all branch and tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make full Git bundle and exact source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backups
          git bundle create backups/BuilderCraft-all-refs.bundle --all
          git archive --format=tar HEAD | gzip -9 > backups/BuilderCraft-source-head.tar.gz
          git rev-parse HEAD > backups/COMMIT.txt
          git branch --show-current > backups/BRANCH.txt
          (cd backups && sha256sum BuilderCraft-all-refs.bundle BuilderCraft-source-head.tar.gz > SHA256SUMS.txt)
          git bundle verify backups/BuilderCraft-all-refs.bundle
      - name: Publish verified portable repository backup
        uses: actions/upload-artifact@v4
        with:
          name: BuilderCraft-full-source-and-git-bundle
          path: backups/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Mirror verified backup to Google Drive (when configured)
        if: ${{ env.GDRIVE_SA_JSON != '' && env.GDRIVE_FOLDER_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          credential_file="$(mktemp)"
          trap 'rm -f "$credential_file"' EXIT
          chmod 600 "$credential_file"
          printf '%s' "$GDRIVE_SA_JSON" > "$credential_file"
          unset GDRIVE_SA_JSON
          export RCLONE_CONFIG_BC_TYPE=drive
          export RCLONE_CONFIG_BC_SCOPE=drive
          export RCLONE_CONFIG_BC_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"
          export RCLONE_CONFIG_BC_SERVICE_ACCOUNT_FILE="$credential_file"
          destination="bc:BuilderCraft/${GITHUB_REF_NAME}/${GITHUB_SHA}"
          rclone copy backups/ "$destination" --transfers 2 --checkers 2
          rclone check backups/ "$destination" --one-way
          echo "Verified Drive mirror for ${GITHUB_SHA}"
