name: Bootstrap LAS evaluation lockfile
on:
  push:
    branches:
      - integration/las-pointcloud-io
    paths:
      - .github/workflows/las-bootstrap.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/las-pointcloud-io
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Lock dependencies and format new source
        run: |
          cargo update --workspace
          cargo fmt --all
      - name: Commit lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/io/src/las_preview.rs crates/io/tests/las_preview.rs crates/io/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "build: lock LAS reader dependencies and format Rust 1.95"
            git push origin HEAD:integration/las-pointcloud-io
          fi
