name: Worldwright modeling acceptance
on:
  push:
    branches:
      - feature/paired-transform-project-flow-pushpull
      - feature/modeling-document-surface-edit
  pull_request:
    paths:
      - crates/kernel/**
      - crates/orbweaver/**
      - crates/engine/**
      - docs/dependencies/**
      - .github/workflows/modeling-acceptance.yml
permissions:
  contents: read
jobs:
  focused-modeling:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Static shared kernel and dependency contract verification
        run: python3 tools/check_paired_tools.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile and run native geometry, graph and CAD command suites
        run: cargo test --locked -p buildercraft-kernel -p orbweaver -p cadcraft-engine
      - name: Strict Rust lints for the modeled command surfaces
        run: cargo clippy --locked -p buildercraft-kernel -p orbweaver -p cadcraft-engine --all-targets -- -D warnings

