name: One-shot modeling stack reconciliation
on:
  push:
    branches:
      - integration/worldwriter-modeling-20261018

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Verify base and fetch exact archived stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" != ""
          git fetch origin a399caa9381af4966008dc562f46e1aebc904d82:refs/heads/stack-old
          test "$(git rev-parse stack-old)" = "a399caa9381af4966008dc562f46e1aebc904d82"
          git config user.name "Worldwright integration bot"
          git config user.email "worldwright-integration@users.noreply.github.com"
      - name: Three-way merge with auditable conflict repair
        shell: bash
        run: |
          set -euo pipefail
          git merge --no-commit --no-ff stack-old || test -n "$(git ls-files -u)"
          python3 tools/reconcile_archived_modeling_stack.py
          # CI's token cannot rewrite repository workflow definitions.
          # Leave the protected mainline workflow files unchanged.
          git restore --source=HEAD --staged --worktree .github/workflows/brep-document-integration.yml .github/workflows/google-drive-source-backup.yml
          cargo fmt --all
          python3 tools/check_paired_tools.py
          git add -A
          git diff --cached --check
          git diff --name-only --diff-filter=U --cached | grep . && exit 1 || true
          git commit -m "feat(integration): reconcile archived Rhino modeling and OCCT stack against main"
          git push origin HEAD:refs/heads/integration/worldwriter-modeling-20261018
