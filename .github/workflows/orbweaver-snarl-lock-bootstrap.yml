name: Temporary OrbWeaver snarl lockfile resolution

on:
  push:
    branches:
      - feature/orbweaver-snarl-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Resolve lockfile for egui-snarl without building code
        run: cargo metadata --format-version 1 > /dev/null
      - name: Emit deterministic Cargo.lock for source-control integration
        run: |
          echo 'ORBW_LOCK_START'
          base64 -w0 Cargo.lock | fold -w 2000
          echo 'ORBW_LOCK_END'
