name: Worldwright rail sweep Rust formatter
on:
  push:
    branches:
      - feature/rail-evaluator-pipe-sweep-foundation
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Format all Rust with pinned toolchain
        run: cargo fmt --all
      - name: Commit formatting of rail/sweep feature only
        shell: bash
        run: |
          git add crates/kernel/src/rail_frames.rs crates/kernel/src/sweep_mesh.rs crates/kernel/src/modeling_path_oriented.rs crates/kernel/src/lib.rs crates/kernel/src/shared_tools.rs crates/kernel/src/registry.rs crates/engine/src/cmd/worldwright_tools.rs crates/orbweaver/tests/modeling_ops.rs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(rail): apply pinned Rust 1.95 formatting'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
