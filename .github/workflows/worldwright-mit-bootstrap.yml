name: Resolve reviewed open-source integration lockfile

# Temporary branch-only bootstrap. This workflow MUST NOT be merged into main.
# Normal repository CI continues to use cargo --locked.
on:
  push:
    branches:
      - integration/mit-geometry-formats
    paths:
      - .github/workflows/worldwright-mit-bootstrap.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/mit-geometry-formats
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Resolve new dependencies without wholesale upgrades
        run: cargo update --workspace
      - name: Format new Rust sources with pinned toolchain
        run: cargo fmt --all
      - name: Commit only deterministic lock and formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/geom/src/robust_predicates.rs crates/io/src/mesh_formats.rs crates/io/tests/mesh_formats.rs crates/geom/src/lib.rs crates/io/src/lib.rs crates/kernel/src/procedural_noise.rs crates/kernel/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "build: pin MIT dependencies and apply Rust 1.95 rustfmt"
            git push origin HEAD:integration/mit-geometry-formats
          fi
