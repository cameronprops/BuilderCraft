[package]
name = "cadcraft-geom"
description = "CADCraft geometry: f64 vectors, curves, arcs, splines, intersections, offsets, snaps"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
curvo-eval = ["dep:curvo", "dep:nalgebra"]

[dependencies]
curvo = { version = "0.3.2", default-features = false, optional = true }
nalgebra = { version = "0.35", optional = true }
serde = { workspace = true }
