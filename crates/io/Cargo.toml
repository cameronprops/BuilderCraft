[package]
name = "cadcraft-io"
description = "CADCraft file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
buildercraft-kernel = { workspace = true }
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-dwg = { workspace = true }
cadcraft-render = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
base64 = "0.22"
miniz_oxide = "0.8"
las = { version = "0.11.1", default-features = false } # MIT; LAZ decompression not enabled
stl_io = "0.11.0" # MIT
tobj = { version = "4.0.5", default-features = false, features = ["use_f64"] } # MIT

[dev-dependencies]
las = { version = "0.11.1", default-features = false }
gltf = { version = "1.4", default-features = false }
